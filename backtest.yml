name: Trading Bot Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "backtest.py"
      - "strategy.py"
      - "risk.py"
      - "indicators.py"
      - "data_provider.py"
      - "config.py"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtests
        run: |
          mkdir -p backtest_results

          python - <<'PY'
          import json
          import config as cfg
          from backtest import run_backtest

          results = []

          for ticker in cfg.WATCHLIST:
              print(f"\n===== {ticker} =====")

              try:
                  result = run_backtest(
                      ticker,
                      period=cfg.DAILY_PERIOD,
                      interval=cfg.SWING_TIMEFRAME,
                  )

                  results.append(result)
                  print(json.dumps(result, indent=2))

              except Exception as exc:
                  error = {
                      "ticker": ticker,
                      "error": f"{type(exc).__name__}: {exc}",
                  }

                  results.append(error)
                  print(json.dumps(error, indent=2))

          with open(
              "backtest_results/results.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(results, f, indent=2)

          successful = [
              r for r in results
              if "error" not in r
          ]

          if not successful:
              raise SystemExit(
                  "No backtests completed successfully."
              )

          print(
              f"\nCompleted "
              f"{len(successful)}/{len(results)} backtests."
          )
          PY

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: backtest_results/results.json
          if-no-files-found: ignore
